<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <!-- Versión mini (16 a 32 px): la misma moneda sin inscripción, con trazos más gruesos para que se lean. -->
  <defs>
    <linearGradient id="zpm-coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fd1a8"/>
      <stop offset=".55" stop-color="#12a07c"/>
      <stop offset="1" stop-color="#ffb547"/>
    </linearGradient>
    <mask id="zpm-hole">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="35" y="35" width="30" height="30" rx="3" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#zpm-hole)">
    <circle cx="50" cy="50" r="48" fill="url(#zpm-coin)"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#10242a" stroke-opacity=".45" stroke-width="5"/>
  </g>
</svg>
